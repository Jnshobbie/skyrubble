<!doctype html><html><head><meta charset="utf-8"><title>Skyrubble</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#8fd8ee;font-family:system-ui,sans-serif;touch-action:none;user-select:none}
canvas{display:block}
.bar{position:fixed;top:12px;height:16px;border:2px solid #fff8;border-radius:4px;background:#0006}
.bar i{display:block;height:100%;width:100%;transition:width .15s}
#hp{left:12px;width:min(32vw,220px)} #hp i{background:#ee2244}
#boss{right:12px;width:min(32vw,220px);display:none} #boss i{background:#d63ea8}
#score{position:fixed;top:6px;left:50%;transform:translateX(-50%);color:#fff;font:900 28px system-ui;text-shadow:0 2px 0 #0007}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#fff;font:900 56px system-ui;text-shadow:0 4px 0 #0008;text-align:center}
#touch{display:none}
#ring{display:none;position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;pointer-events:none}
#arc{position:absolute;inset:0;border-radius:50%;border:4px solid #3aa0ffdd;box-shadow:0 0 14px #3aa0ff88;clip-path:polygon(0 0,100% 0,100% 50%,0 50%);opacity:.35}
#dot{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;background:#3aa0ffaa;transform:translate(-50%,-50%)}
#fire{position:fixed;right:calc(28px + env(safe-area-inset-right));bottom:calc(28px + env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;border:3px solid #3aa0ffcc;background:#3aa0ff22;box-shadow:0 0 14px #3aa0ff66;color:#fff;font:900 34px/112px system-ui;text-align:center;pointer-events:none}
#fire.on{background:#3aa0ff77}
</style></head><body>
<div class="bar" id="hp"><i></i></div><div id="score">0</div><div class="bar" id="boss"><i></i></div><div id="msg"></div>
<div id="touch"><div id="ring"><div id="arc"></div><div id="dot"></div></div><div id="fire">✦</div></div>
<script type="module" src="/src/main.ts"></script></body></html>
